services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: tsdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tsdb
      TZ: Africa/Kigali
      TS_TUNE_MEMORY: 2GB
      TS_TUNE_CPUS: "4"
    ports: ["5432:5432"]
    volumes: [ tsdb_data:/var/lib/postgresql/data ]
    cpus: "4"
    mem_limit: 2g
    shm_size: 512m
    restart: unless-stopped
  
  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    environment:
      TZ: Africa/Kigali
      EMQX_NAME: emqx
    ports: ["1883:1883","18083:18083"]
    mem_limit: 1g
    restart: unless-stopped

volumes:
  tsdb_data: